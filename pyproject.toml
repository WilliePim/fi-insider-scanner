[project]
name = "fi-insider-scanner"
version = "0.1.0"
description = "Insider svedesi da FI Insynsregistret: ingest canonico, gate Layer 1, backtest event-time, dossier."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pydantic>=2.7",
  "yfinance==1.6.0",
]

[project.scripts]
fi-scan = "fi_insider_scanner.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fi_insider_scanner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["snapshot: richiede lo snapshot dati in data/ (e rete per i dati di mercato)"]
addopts = "-m 'not snapshot'"
